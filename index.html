<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: transparent;
}

#pub-amazon {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    z-index: 999999;

    background: white;
    border-bottom: 2px solid #ff9900;
    box-shadow: 0 3px 12px rgba(0,0,0,0.25);

    padding: 10px;
    text-align: center;
}

#pub-amazon a {
    display: inline-block;
    background: #ff9900;
    color: #111;
    text-decoration: none;
    font-weight: bold;
    padding: 11px 20px;
    border-radius: 7px;
    margin-left: 10px;
}

#pub-amazon .titre {
    font-size: 18px;
    font-weight: bold;
}

#pub-amazon .mention {
    font-size: 9px;
    color: #777;
    margin-top: 5px;
}

@media (max-width: 600px) {

    #pub-amazon {
        padding: 8px;
    }

    #pub-amazon .titre {
        font-size: 15px;
        display: block;
        margin-bottom: 7px;
    }

    #pub-amazon a {
        margin-left: 0;
        padding: 9px 15px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div id="pub-amazon">

    <span class="titre">
        🛒 MES BONS PLANS AMAZON
    </span>

    <a href="https://amzn.to/4hihgNN"
       target="_blank"
       rel="nofollow sponsored noopener">
        VOIR SUR AMAZON ➜
    </a>

    <div class="mention">
        Lien partenaire Amazon
    </div>

</div>

</body>
</html>
