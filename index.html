<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

.pub-amazon {
    width: 300px;
    max-width: calc(100vw - 20px);
    margin: 0 auto;
    box-sizing: border-box;
    background: white;
    border: 2px solid #ff9900;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

.titre {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 10px;
}

.texte {
    font-size: 15px;
    line-height: 1.4;
    margin-bottom: 15px;
}

.bouton {
    display: block;
    background: #ff9900;
    color: #111;
    text-decoration: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

.mention {
    margin-top: 10px;
    font-size: 10px;
    color: #777;
}
</style>
</head>

<body>

<div class="pub-amazon">

    <div class="titre">
        🛒 AMAZON
    </div>

    <div class="texte">
        Découvrez ma sélection et mes bons plans sur Amazon.
    </div>

    <a class="bouton"
       href="https://amzn.to/4hihgNN"
       target="_blank"
       rel="nofollow sponsored noopener">
        VOIR SUR AMAZON ➜
    </a>

    <div class="mention">
        Lien partenaire Amazon
    </div>

</div>

</body>
</html>
