<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.15);
    z-index: 999999;
}

#pub {
    position: relative;
    width: 300px;
    max-width: calc(100vw - 20px);
    height: 300px;
    box-sizing: border-box;
    background: white;
    border: 3px solid #ff9900;
    border-radius: 16px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.35);
    padding: 30px 18px 18px;
    text-align: center;
}

#close {
    position: absolute;
    top: 5px;
    right: 10px;
    border: 0;
    background: transparent;
    font-size: 26px;
    cursor: pointer;
}

h2 {
    margin: 20px 0 10px;
    font-size: 25px;
}

p {
    font-size: 16px;
    line-height: 1.4;
}

.amazon-btn {
    display: block;
    margin-top: 25px;
    background: #ff9900;
    color: #111;
    text-decoration: none;
    padding: 14px;
    border-radius: 9px;
    font-size: 17px;
    font-weight: bold;
}

.mention {
    margin-top: 14px;
    font-size: 10px;
    color: #777;
}
</style>
</head>

<body>

<div id="overlay">

    <div id="pub">

        <button id="close" aria-label="Fermer">×</button>

        <h2>🛒 AMAZON</h2>

        <p>
            Découvrez ma sélection et mes bons plans sur Amazon.
        </p>

        <a
          class="amazon-btn"
          href="https://amzn.to/4hihgNN"
          target="_blank"
          rel="nofollow sponsored noopener">
            VOIR SUR AMAZON ➜
        </a>

        <div class="mention">
            En tant que Partenaire Amazon, je réalise un bénéfice sur les achats remplissant les conditions requises.
        </div>

    </div>

</div>

<script>
document.getElementById("close").onclick = function () {
    document.getElementById("overlay").style.display = "none";
};
</script>

</body>
</html>
