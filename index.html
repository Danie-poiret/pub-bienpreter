<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: Arial, sans-serif;
}

body {
    overflow: hidden;
}

.banner {
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(90deg, #ff9900, #ffb84d);
    color: #111;
    border: 2px solid #e68a00;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.20);
    padding: 14px 18px;
}

.banner-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.banner-text {
    font-size: 22px;
    font-weight: bold;
    line-height: 1.2;
}

.banner-sub {
    font-size: 13px;
    margin-top: 4px;
    font-weight: normal;
}

.banner-btn {
    display: inline-block;
    background: #111;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
    padding: 12px 18px;
    border-radius: 10px;
    white-space: nowrap;
}

.mention {
    font-size: 10px;
    margin-top: 8px;
    color: #333;
    text-align: center;
}

@media (max-width: 700px) {
    .banner-inner {
        flex-direction: column;
        text-align: center;
    }

    .banner-text {
        font-size: 18px;
    }

    .banner-sub {
        font-size: 12px;
    }

    .banner-btn {
        width: 100%;
        box-sizing: border-box;
    }
}
</style>
</head>

<body>

<div class="banner">
    <div class="banner-inner">
        <div>
            <div class="banner-text">🛒 DÉCOUVRE MES BONS PLANS AMAZON</div>
            <div class="banner-sub">Clique ici pour voir ma sélection et mes offres du moment</div>
        </div>

        <a class="banner-btn"
           href="https://amzn.to/4hihgNN"
           target="_blank"
           rel="nofollow sponsored noopener">
           VOIR LES OFFRES ➜
        </a>
    </div>

    <div class="mention">
        En tant que Partenaire Amazon, je réalise un bénéfice sur les achats remplissant les conditions requises.
    </div>
</div>

</body>
</html>
